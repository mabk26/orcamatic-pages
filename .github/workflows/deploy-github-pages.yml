name: Deploy Orcamatic site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never publish two deployments at once; queued runs still finish.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Package the website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Fail the run before anything is published if a page is broken: unbalanced
      # markup, a class with no rule, an internal link with no file behind it, a
      # missing head tag, inline styles (the CSP blocks them), bad structured data.
      - name: Check the site
        run: python3 tools/check-site.py

      # The website lives at the repository root, so copy only the public files
      # into _site/ and leave .github/, README.md, LICENSE and .gitignore out.
      - name: Collect public files
        run: |
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' ! -name '_site' \
            ! -name '.gitignore' ! -name 'README.md' ! -name 'LICENSE' \
            ! -name 'docs' ! -name 'tools' \
            -exec cp -r {} _site/ \;

      - name: Show what will be published
        run: find _site -type f | sort

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
